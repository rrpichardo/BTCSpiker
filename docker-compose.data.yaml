services:
  cbb26-staging:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btcspiker
      POSTGRES_USER: btcspiker
      POSTGRES_PASSWORD: btcspiker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./data/coinbase_history/cache:/imports:ro
      - ./btcspiker_data/sql/cbb26_staging.sql:/docker-entrypoint-initdb.d/cbb26_staging.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcspiker -d btcspiker"]
      interval: 5s
      timeout: 3s
      retries: 20
