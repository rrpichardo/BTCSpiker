server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # More specific prefix must come before the general /api/ block.
    location /api/predictions/ {
        proxy_pass http://materializer:8090/predictions/;
    }

    location /api/ {
        proxy_pass http://api:8000/;
    }

    location / {
        try_files $uri /index.html;
    }
}
