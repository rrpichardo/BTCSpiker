server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream service names per-request via Docker's embedded DNS.
    # With a literal proxy_pass hostname nginx resolves once at startup and
    # caches the IP forever, so recreating the api/materializer container
    # (e.g. the runbook's read-model rebuild) would leave the UI proxying
    # to a dead IP (502) until the ui container was restarted. proxy_pass
    # through a variable forces re-resolution, honoring `valid=10s`.
    resolver 127.0.0.11 valid=10s;

    # More specific prefixes must come before the general /api/ block.
    location /api/predictions/ {
        set $materializer_upstream materializer:8090;
        rewrite ^/api(/predictions/.*)$ $1 break;
        proxy_pass http://$materializer_upstream;
    }

    # The tournament projection is served by the materializer too, so it needs
    # its own rule -- otherwise the general /api/ block below would send it to
    # the prediction API, which knows nothing about tournament runs.
    location /api/tournament/ {
        set $tournament_upstream materializer:8090;
        rewrite ^/api(/tournament/.*)$ $1 break;
        proxy_pass http://$tournament_upstream;
    }

    location /api/ {
        set $api_upstream api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$api_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
