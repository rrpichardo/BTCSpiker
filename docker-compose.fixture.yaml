# Isolated stack for verifying /predictions/timeline against a known, seeded
# dataset -- never the live named volume or live Kafka topics. Run under a
# distinct project name so containers, network, and (non-bind-mount) volumes
# never collide with the live stack:
#
#   FIXTURE_DB_DIR=/path/to/temp/dir docker compose -p btcspiker-fixture \
#     -f docker-compose.fixture.yaml up -d --build
#   ... verify http://localhost:${FIXTURE_UI_PORT:-13001} ...
#   docker compose -p btcspiker-fixture -f docker-compose.fixture.yaml down -v
#
# FIXTURE_DB_DIR must contain a predictions.db already built by
# scripts/seed_timeline_fixture.py (bind-mounted read-write below).

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "${FIXTURE_KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ticks.predictions --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ticks.outcomes    --partitions 1 --replication-factor 1
      echo 'Topics created.'
      "
    restart: "no"

  materializer:
    build:
      context: .
      dockerfile: materializer/Dockerfile
    ports:
      - "${FIXTURE_MATERIALIZER_PORT:-18090}:8090"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC_PREDICTIONS: ticks.predictions
      TOPIC_OUTCOMES: ticks.outcomes
      KAFKA_GROUP_ID: materializer-fixture
      KAFKA_OUTCOMES_GROUP_ID: materializer-fixture-outcomes
      PREDICTIONS_DB_PATH: /data/predictions.db
    volumes:
      - ${FIXTURE_DB_DIR}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    ports:
      - "${FIXTURE_UI_PORT:-13001}:80"
    depends_on:
      materializer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"
