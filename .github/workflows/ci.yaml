name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        # Pinned: an unpinned `pip install black ruff` silently picks up
        # whatever's newest on each run, and black/ruff's formatting/lint
        # opinions drift between versions -- that made CI fail on every push
        # regardless of code changes once a newer release shipped. Pinned to
        # match the versions the repo is actually formatted against.
        run: pip install black==23.11.0 ruff==0.15.22

      - name: Black (format check)
        run: black --check api/ materializer/ scripts/feature_to_predict_bridge.py tests/

      - name: Ruff (lint check)
        run: ruff check api/ materializer/ scripts/feature_to_predict_bridge.py tests/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install unit-test dependencies
        # requirements-ml.txt pulls in pandas/pyarrow/mlflow/sklearn (via
        # handoff/requirements.txt) plus psutil/optuna — tests/ml/ imports
        # all of these at collection time.
        run: pip install -r requirements-dev.txt -r docker/requirements.api.txt -r materializer/requirements.txt -r requirements-ml.txt

      - name: Run unit tests
        run: pytest tests --ignore=tests/test_replay_integration.py

  integration-replay:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    # This job must pass before a PR can be merged — do not add continue-on-error
    steps:
      - uses: actions/checkout@v5

      - name: Copy env file and set fast replay speed for CI
        run: cp .env.example .env && echo "REPLAY_SPEED=50" >> .env

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for stack to be healthy
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health >/dev/null && \
               curl -sf http://localhost:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run replay integration test
        run: pytest tests/test_replay_integration.py -v --tb=short --retries 2

      - name: Assert predictions reach the UI proxy
        run: |
          curl -sf http://localhost:3001/api/predictions/recent \
            | jq -e '.count > 0 and (.predictions | length > 0)'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs > docker-compose-failure.log

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose-failure.log

      - name: Tear down stack
        if: always()
        run: docker compose down -v
